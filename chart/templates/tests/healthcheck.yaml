apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "production-kubernetes-app.fullname" . }}-test-connection"
  labels:
    {{- include "production-kubernetes-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ["wget"]
      args:
        - "-qO-"
        - "http://{{ include "production-kubernetes-app.fullname" . }}:{{ .Values.service.port }}/healthz"
